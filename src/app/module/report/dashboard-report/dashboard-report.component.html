<div class="px-8 pb-10">
    <p class=" text-[#0D5CAB] font-bold text-2xl">Daftar Laporan</p>
    <br>

    <div class="flex gap-10">
        <span *ngFor="let data of listReport"
            class="w-40 h-40 rounded bg-slate-200 flex p-2 justify-center items-center hover:cursor-pointer"
            (click)="click(data.value)">
            <p class="text-[#0D5CAB] text-xl font-semibold">{{data.key}}</p>
        </span>
    </div>

</div>
