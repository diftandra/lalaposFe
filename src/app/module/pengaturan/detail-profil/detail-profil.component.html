<div class="px-8 pb-10">
    <p class=" text-[#0D5CAB] font-bold text-2xl">{{titel}} Supplier</p>
    <br>


    <form action="" [formGroup]="formGroup">
        <div class="grid grid-cols-[20%,20%]">
            <p class="self-center">Tanggal/Jam</p>
            <mat-form-field appearance="outline" class="w-[90%]">
                <mat-label>Tanggal/Jam</mat-label>
                <input matInput formControlName="created_date">
            </mat-form-field>
            <p class="self-center">UserName</p>
            <mat-form-field appearance="outline" class="w-[90%]">
                <mat-label>UserName</mat-label>
                <input matInput formControlName="username">
            </mat-form-field>
            <p class="self-center">Full Name </p>
            <mat-form-field appearance="outline" class="w-[90%]">
                <mat-label>Full Name </mat-label>
                <input matInput formControlName="full_name">
            </mat-form-field>
            <p class="self-center">Password</p>
            <mat-form-field appearance="outline" class="w-[90%]">
                <mat-label>Password</mat-label>
                <input matInput formControlName="password" type="password">
            </mat-form-field>

            <p class="self-center">Role</p>
            <mat-form-field appearance="outline" class="w-[90%]">
                <mat-label>Role</mat-label>
                <mat-select formControlName="role">
                    <mat-option *ngFor="let role of listRole" [value]="role.role_group_code"> {{role.role_group_code}}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <p class="self-center">Active</p>


            <mat-radio-group [ngModelOptions]="{standalone: true}" aria-label="Select an option"
                (change)="setDataRadio($event)" [(ngModel)]="data.is_active">
                <mat-radio-button [value]="true" class="mx-2">Aktif</mat-radio-button>
                <mat-radio-button [value]="false">Non-Aktif</mat-radio-button>
            </mat-radio-group>
        </div>

    </form>


    <button [disabled]="disabel" (click)="simpan()" [ngClass]="{'bg-blue-300':true}"
        class=" absolute bottom-10 right-5 w-60 bg-blue-300 text-xl  h-12 rounded text-white font-bold">Kirim</button>

</div>
