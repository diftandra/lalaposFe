<div class="px-8 pb-10">
    <p class=" text-[#0D5CAB] font-bold text-2xl">Daftar User</p>
    <br>

    <div class="flex justify-end my-4">

        <button (click)="tambah()" [ngClass]="{'bg-blue-300':true}"
            class=" w-60 bg-blue-300 text-xl  h-12 rounded text-white font-bold">Tambah User</button>
    </div>

    <table mat-table [dataSource]="dataSource" matSort multiTemplateDataRows>
        <ng-container matColumnDef="user_id">
            <th *matHeaderCellDef mat-sort-header class="rounded-l-md">
                UserName
            </th>
            <td mat-cell *matCellDef="let element">
                {{ element.username }}
            </td>
        </ng-container>

        <ng-container matColumnDef="username">
            <th *matHeaderCellDef mat-sort-header>Nama </th>
            <td mat-cell *matCellDef="let element">
                {{ element.username }}
            </td>
        </ng-container>

        <ng-container matColumnDef="full_name">
            <th *matHeaderCellDef mat-sort-header>Role</th>
            <td mat-cell *matCellDef="let element">{{
                element.full_name
                }}</td>
        </ng-container>

        <ng-container matColumnDef="is_active">
            <th *matHeaderCellDef mat-sort-header>Status</th>
            <td mat-cell *matCellDef="let element">
                <img *ngIf="element.is_active" class="h-8 w-8" src="assets/Icon/centang.svg" alt="">
                <img *ngIf="!element.is_active" class="h-6 w-6" src="assets/Icon/cross.svg" alt="">
            </td>
        </ng-container>



        <ng-container matColumnDef="actn">
            <th *matHeaderCellDef mat-sort-header></th>
            <td id="editC" mat-cell *matCellDef="let element">
                <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="18" r="2" transform="rotate(-180 12 18)" fill="#C4C4C4" />
                        <circle cx="12" cy="12" r="2" transform="rotate(-180 12 12)" fill="#C4C4C4" />
                        <circle cx="12" cy="6" r="2" transform="rotate(-180 12 6)" fill="#C4C4C4" />
                    </svg>
                </button>
                <mat-menu #menu="matMenu">
                    <button mat-menu-item class="hover:font-bold" (click)="edit(element.username)">
                        <span>Edit</span>
                    </button>
                    <button mat-menu-item class="hover:font-bold" (click)="delete(element.username)">
                        <span>Delete</span>
                    </button>
                </mat-menu>
            </td>
        </ng-container>


        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-[#F0EFEF] border-b-0 h-14"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="hover:cursor-pointer hover:bg-[#F4F9FF]">
        </tr>
    </table>

    <table>
        <tr *ngIf="dataSource.filteredData.length == 0">
            <td class="text-center py-4" [attr.colspan]="displayedColumns.length">
                Data Tidak Ditemukan
            </td>
        </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10,25,50, 100, ]" showFirstLastButtons
        aria-label="Select page of periodic elements">
    </mat-paginator>
</div>
