<div class="px-4 sm:px-8 pb-10">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-5">
        <h1 class="text-2xl font-bold text-base-content">Daftar Merk</h1>
        <button (click)="tambah()" class="btn btn-primary gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            Tambah Merk
        </button>
    </div>

    <div class="card bg-base-100 shadow-md">
        <div class="card-body p-4 sm:p-5">
            <form [formGroup]="formGroup" class="flex flex-wrap items-center gap-3 mb-2">
                <mat-form-field appearance="outline" class="w-40">
                    <mat-label>Cari berdasarkan</mat-label>
                    <mat-select formControlName="search">
                        <mat-option *ngFor="let data of listSearch" [value]="data.value"
                            (click)="changeSelectedSearch(data.value)">{{ data.key }}</mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field appearance="outline" class="flex-1 min-w-[200px]">
                    <mat-label>Kata kunci</mat-label>
                    <input matInput formControlName="value" (keyup)="strSearch($event)" placeholder="Ketik untuk mencari...">
                </mat-form-field>
            </form>

            <div class="overflow-x-auto">
                <table mat-table [dataSource]="dataSource" matSort multiTemplateDataRows class="w-full">
                    <ng-container matColumnDef="brandCode">
                        <th *matHeaderCellDef mat-sort-header>Kode Merk</th>
                        <td mat-cell *matCellDef="let element">{{ element.brandCode }}</td>
                    </ng-container>
                    <ng-container matColumnDef="brandName">
                        <th *matHeaderCellDef mat-sort-header>Nama Merk</th>
                        <td mat-cell *matCellDef="let element">{{ element.brandName }}</td>
                    </ng-container>
                    <ng-container matColumnDef="created_date">
                        <th *matHeaderCellDef mat-sort-header>Tanggal Dibuat</th>
                        <td mat-cell *matCellDef="let element">{{ element.created_date }}</td>
                    </ng-container>
                    <ng-container matColumnDef="isActive">
                        <th *matHeaderCellDef mat-sort-header>Status</th>
                        <td mat-cell *matCellDef="let element">
                            <span *ngIf="element.isActive" class="badge badge-success badge-outline gap-1">Aktif</span>
                            <span *ngIf="!element.isActive" class="badge badge-ghost gap-1">Nonaktif</span>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="actn">
                        <th *matHeaderCellDef></th>
                        <td id="editC" mat-cell *matCellDef="let element">
                            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Aksi">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="12" cy="18" r="2" transform="rotate(-180 12 18)" fill="#C4C4C4" />
                                    <circle cx="12" cy="12" r="2" transform="rotate(-180 12 12)" fill="#C4C4C4" />
                                    <circle cx="12" cy="6" r="2" transform="rotate(-180 12 6)" fill="#C4C4C4" />
                                </svg>
                            </button>
                            <mat-menu #menu="matMenu">
                                <button mat-menu-item (click)="edit(element.brandCode)"><span>Edit</span></button>
                                <button mat-menu-item (click)="delete(element.brandCode)"><span>Hapus</span></button>
                            </mat-menu>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-base-200 h-12"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns" class="hover:bg-base-200/60 cursor-pointer transition-colors"></tr>
                </table>

                <div *ngIf="dataSource.filteredData.length == 0" class="text-center py-8 text-base-content/50">
                    Data tidak ditemukan
                </div>
            </div>

            <mat-paginator [pageSizeOptions]="[10,25,50,100]" showFirstLastButtons aria-label="Pilih halaman"></mat-paginator>
        </div>
    </div>
</div>
