<div class="px-4 sm:px-8 pb-10">
    <h1 class="text-2xl font-bold text-base-content mb-5">{{ titel }} Supplier</h1>

    <div class="card bg-base-100 shadow-md max-w-3xl">
        <div class="card-body p-5 sm:p-7">
            <form [formGroup]="formGroup" class="grid grid-cols-1 sm:grid-cols-[180px,1fr] gap-x-4 gap-y-1 items-center">
                <label class="text-sm font-medium text-base-content/80">Tanggal / Jam</label>
                <mat-form-field appearance="outline">
                    <mat-label>Tanggal/Jam</mat-label>
                    <input matInput formControlName="created_date">
                </mat-form-field>

                <label class="text-sm font-medium text-base-content/80">Kode Supplier</label>
                <mat-form-field appearance="outline">
                    <mat-label>Kode Supplier</mat-label>
                    <input matInput formControlName="supplierCode">
                </mat-form-field>

                <label class="text-sm font-medium text-base-content/80">Nama Supplier</label>
                <mat-form-field appearance="outline">
                    <mat-label>Nama Supplier</mat-label>
                    <input matInput formControlName="supplierName">
                </mat-form-field>

                <label class="text-sm font-medium text-base-content/80">Kontak Supplier</label>
                <mat-form-field appearance="outline">
                    <mat-label>Kontak Supplier</mat-label>
                    <input matInput formControlName="supplierContact">
                </mat-form-field>

                <label class="text-sm font-medium text-base-content/80">Alamat Supplier</label>
                <mat-form-field appearance="outline">
                    <mat-label>Alamat Supplier</mat-label>
                    <textarea matInput formControlName="supplierAddress"></textarea>
                </mat-form-field>

                <label class="text-sm font-medium text-base-content/80">Keterangan</label>
                <mat-form-field appearance="outline">
                    <mat-label>Keterangan</mat-label>
                    <textarea matInput formControlName="supplierNotes"></textarea>
                </mat-form-field>
            </form>

            <div class="card-actions justify-end mt-4">
                <button [disabled]="disabel" (click)="simpan()" class="btn btn-primary px-10">Kirim</button>
            </div>
        </div>
    </div>
</div>
