<div class="px-8 pb-10">
    <p class=" text-[#0D5CAB] font-bold text-2xl">{{titel}} Supplier</p>
    <br>


    <form action="" [formGroup]="formGroup">
        <div class="grid grid-cols-[20%,20%]">
            <p class="self-center">Tanggal/Jam</p>
            <mat-form-field appearance="outline" class="w-[90%]">
                <mat-label>Tanggal/Jam</mat-label>
                <input matInput formControlName="created_date">
            </mat-form-field>
            <p class="self-center">Code Supplier</p>
            <mat-form-field appearance="outline" class="w-[90%]">
                <mat-label>Code Supplier</mat-label>
                <input matInput formControlName="supplierCode">
            </mat-form-field>
            <p class="self-center">Nama Supplier</p>
            <mat-form-field appearance="outline" class="w-[90%]">
                <mat-label>Nama Supplier</mat-label>
                <input matInput formControlName="supplierName">
            </mat-form-field>
            <p class="self-center">Kontak Supplier</p>
            <mat-form-field appearance="outline" class="w-[90%]">
                <mat-label>Kontak Merk</mat-label>
                <input matInput formControlName="supplierContact">
            </mat-form-field>
            <p class="self-center">Alamat Supplier</p>
            <mat-form-field appearance="outline" class="w-[90%]">
                <mat-label>Alamat Supplier</mat-label>
                <textarea matInput formControlName="supplierAddress"></textarea>
            </mat-form-field>
            <p class="self-center">Keterangan</p>
            <mat-form-field appearance="outline" class="w-[90%]">
                <mat-label>Keterangan</mat-label>
                <textarea matInput formControlName="supplierNotes"></textarea>
            </mat-form-field>





        </div>

    </form>


    <button [disabled]="disabel" (click)="simpan()" [ngClass]="{'bg-blue-300':true}"
        class=" absolute bottom-10 right-5 w-60 bg-blue-300 text-xl  h-12 rounded text-white font-bold">Kirim</button>

</div>
