<button class="btn btn-ghost btn-square text-primary-content hover:bg-white/15" (click)="onOpenSidebar()" aria-label="Buka menu">
    <svg width="26" height="26" viewBox="0 0 48 48" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="12" width="28" height="4" rx="2" />
        <rect x="10" y="22" width="28" height="4" rx="2" />
        <rect x="10" y="32" width="28" height="4" rx="2" />
    </svg>
</button>

<aside class="fixed top-0 left-0 z-40 flex flex-col bg-neutral text-neutral-content h-screen w-[300px] shadow-2xl transition-transform duration-200 ease-in-out"
    [ngClass]="{ '-translate-x-full': !openSidebar }">

    <!-- brand header -->
    <div class="flex items-center gap-3 px-5 h-[4.5rem] bg-gradient-to-r from-primary to-secondary text-primary-content shrink-0">
        <div class="w-9 h-9 rounded-lg bg-white grid place-items-center p-1 shadow-sm">
          <img src="assets/logo.png" alt="Lala PoS" class="w-full h-full object-contain" />
        </div>
        <span class="font-bold text-lg">Lala PoS</span>
        <button class="btn btn-ghost btn-sm btn-square ml-auto hover:bg-white/15" (click)="onCloseSidebar()" aria-label="Tutup menu">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                    d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                    clip-rule="evenodd" />
            </svg>
        </button>
    </div>

    <div class="flex-1 overflow-y-auto py-3">
        <app-sidenav-menu (changePage)="onCloseSidebar()"></app-sidenav-menu>
    </div>
</aside>

<div class="fixed left-0 bottom-0 z-30 w-screen h-screen bg-black/50 backdrop-blur-sm transition-opacity"
    [ngClass]="{ 'invisible opacity-0': !openSidebar, 'opacity-100': openSidebar }" (click)="onCloseSidebar()"></div>
