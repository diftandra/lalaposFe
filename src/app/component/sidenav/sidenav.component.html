<button class="rounded-lg text-white hover:bg-gray-200/20 active:bg-gray-200/30" (click)="onOpenSidebar()">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="12" width="28" height="4" rx="2" />
        <rect x="10" y="22" width="28" height="4" rx="2" />
        <rect x="10" y="32" width="28" height="4" rx="2" />
    </svg>
</button>

<div class="fixed top-0 left-0 z-20 flex flex-col bg-[#1591CD] h-screen w-[316px] transition-all duration-200 ease-in-out"
    [ngClass]="{ '-translate-x-full': !openSidebar }">
    <button class="text-white mt-4 mr-4 mb-16 ml-auto h-5 w-5 rounded-md hover:bg-gray-100/20 active:bg-gray-200/30"
        (click)="onCloseSidebar()">
        <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fillRule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clipRule="evenodd" />
        </svg>
    </button>

    <app-sidenav-menu (changePage)="onCloseSidebar()"></app-sidenav-menu>
</div>

<div class="fixed left-0 bottom-0 z-10 w-screen h-screen bg-black/50 transition-[visibility]"
    [ngClass]="{ invisible: !openSidebar }" (click)="onCloseSidebar()"></div>
