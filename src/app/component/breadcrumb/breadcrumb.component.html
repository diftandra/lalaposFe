<div class="pt-[5.5rem] px-4 sm:px-8 pb-2" *ngIf="breadcrumbs.length != 0">
  <div class="text-sm breadcrumbs text-base-content/70">
    <ul>
      <li>
        <a class="link link-hover text-primary font-medium" href="home">Home</a>
      </li>
      <li *ngFor="let breadcrumb of breadcrumbs; let i = index" [class.font-semibold]="i === breadcrumbs.length - 1">
        <a *ngIf="i != breadcrumbs.length - 1" class="link link-hover text-primary"
          [routerLink]="[breadcrumb.url]" [queryParams]="breadcrumb.param">
          {{ breadcrumb.name }}
        </a>
        <span *ngIf="i == breadcrumbs.length - 1" class="text-base-content">{{ breadcrumb.name }}</span>
      </li>
    </ul>
  </div>
</div>
