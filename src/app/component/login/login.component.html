<div class="login-page min-h-screen w-full flex" data-theme="lalapos">

  <!-- Left: branded panel -->
  <div class="login-hero hidden lg:flex lg:w-[55%] relative overflow-hidden text-white">
    <!-- decorative floating shapes -->
    <span class="blob blob-1 animate-float-slow"></span>
    <span class="blob blob-2 animate-float-slow"></span>
    <span class="blob blob-3 animate-float-slow"></span>

    <div class="relative z-10 flex flex-col justify-between p-14 w-full">
      <!-- brand -->
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-white/95 grid place-items-center text-primary text-2xl font-extrabold shadow-lg">
          L
        </div>
        <span class="text-xl font-bold tracking-wide">Lala PoS</span>
      </div>

      <!-- headline -->
      <div class="max-w-md animate-fade-in-up">
        <h1 class="text-5xl font-extrabold leading-tight">Welcome back</h1>
        <p class="mt-4 text-lg text-white/85">
          Kelola stok, order, dan laporan toko Anda dalam satu tempat.
        </p>
        <div class="mt-8 h-px w-80 bg-white/25"></div>
        <p class="mt-5 text-sm text-white/80 tracking-wide">Cepat &middot; Aman &middot; Siap offline</p>
      </div>

      <p class="text-xs text-white/60">&copy; {{ year }} Lala PoS</p>
    </div>
  </div>

  <!-- Right: login card -->
  <div class="flex-1 flex items-center justify-center p-6 bg-base-200">
    <div class="card w-full max-w-md bg-base-100 shadow-xl animate-fade-in-up">
      <div class="card-body p-8 sm:p-10">

        <!-- mobile brand (shown when hero is hidden) -->
        <div class="lg:hidden flex items-center gap-3 mb-6">
          <div class="w-11 h-11 rounded-xl bg-primary grid place-items-center text-primary-content text-xl font-extrabold">
            L
          </div>
          <span class="text-lg font-bold text-base-content">Lala PoS</span>
        </div>

        <h2 class="text-2xl font-bold text-base-content">User Login</h2>
        <p class="text-sm text-base-content/60 mt-1">Masuk untuk melanjutkan</p>

        <!-- error alert -->
        <div *ngIf="!auth" class="alert alert-error mt-5 py-2 text-sm" role="alert">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>Username / Password salah</span>
        </div>

        <form id="form" [formGroup]="formGroup" (ngSubmit)="login()" class="mt-6 space-y-4">
          <!-- username -->
          <div class="form-control">
            <label class="label pb-1" for="username">
              <span class="label-text font-medium">Username</span>
            </label>
            <input id="username" type="text" formControlName="username" autocomplete="username"
              placeholder="Masukkan username"
              class="input input-bordered w-full focus:input-primary"
              [class.input-error]="isInvalid('username')" />
            <label class="label pt-1" *ngIf="isInvalid('username')">
              <span class="label-text-alt text-error">Username wajib diisi</span>
            </label>
          </div>

          <!-- password -->
          <div class="form-control">
            <label class="label pb-1" for="password">
              <span class="label-text font-medium">Password</span>
            </label>
            <div class="relative">
              <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
                autocomplete="current-password" placeholder="Masukkan password"
                class="input input-bordered w-full pr-12 focus:input-primary"
                [class.input-error]="isInvalid('password')" />
              <button type="button" (click)="showPassword = !showPassword" tabindex="-1"
                class="absolute inset-y-0 right-0 px-3 flex items-center text-base-content/50 hover:text-base-content"
                [attr.aria-label]="showPassword ? 'Sembunyikan password' : 'Tampilkan password'">
                <!-- eye -->
                <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <!-- eye-off -->
                <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                </svg>
              </button>
            </div>
            <label class="label pt-1" *ngIf="isInvalid('password')">
              <span class="label-text-alt text-error">Password wajib diisi</span>
            </label>
          </div>

          <!-- submit -->
          <button type="submit" class="btn btn-primary w-full mt-2" [disabled]="loading">
            <span *ngIf="loading" class="loading loading-spinner loading-sm"></span>
            {{ loading ? 'Memproses...' : 'Login' }}
          </button>
        </form>

      </div>
    </div>
  </div>
</div>
